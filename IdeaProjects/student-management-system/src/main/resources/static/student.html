<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Student Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:#f3f4f6;transition:.3s}
        .dashboard{display:flex;min-height:100vh}.sidebar{width:260px;background:linear-gradient(180deg,#111827,#1e3a8a);color:#fff;padding:30px 20px;position:fixed;height:100%;box-shadow:4px 0 20px rgba(0,0,0,.2)}
        .sidebar h2{text-align:center;margin-bottom:40px;font-size:30px}.sidebar button{width:100%;padding:15px;margin:12px 0;border:none;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:16px;transition:.3s}.sidebar button:hover{background:#2563eb;transform:translateX(6px)}.logout-btn{background:#dc2626!important}
        .main-content{margin-left:280px;padding:30px;width:100%}.header{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;padding:30px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 25px rgba(0,0,0,.2)}.header h1{font-size:34px}.dark-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:12px 18px;border-radius:10px;cursor:pointer}
        .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:30px 0}.card,.box,.table-box{background:#fff;padding:25px;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.08)}.card{text-align:center;transition:.3s}.card:hover{transform:translateY(-5px)}.card h3{color:gray;margin-bottom:10px}.card p{font-size:24px;font-weight:bold;color:#2563eb}
        .content-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}.box h2{margin-bottom:20px;color:#111827}.profile-photo{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid #2563eb;display:block;margin:0 auto 20px}
        input{width:100%;padding:14px;margin:10px 0;border:1px solid #d1d5db;border-radius:10px;font-size:15px}.btn{padding:12px 18px;border:none;border-radius:10px;color:#fff;cursor:pointer;margin-top:10px;margin-right:8px;font-size:15px}.upload-btn{background:#7c3aed}.update-btn{background:#16a34a}.password-btn{background:#2563eb}.show-btn{background:#6b7280}
        .progress-bar{width:100%;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:20px}.progress{width:80%;background:linear-gradient(90deg,#16a34a,#22c55e);padding:10px;color:#fff;text-align:center}
        .table-box{margin-top:30px}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#2563eb;color:#fff;padding:14px}td{padding:14px;border-bottom:1px solid #ddd;text-align:center}tr:hover{background:#f9fafb}
        .dark-mode{background:#111827!important;color:#fff!important}.dark-mode .box,.dark-mode .card,.dark-mode .table-box{background:#1f2937;color:#fff}
        @media(max-width:900px){.cards,.content-grid{grid-template-columns:1fr}.sidebar{position:relative;width:100%;height:auto}.main-content{margin-left:0}}
    </style>
</head>
<body>
<div class="dashboard">
    <div class="sidebar">
        <h2>🎓 Student Panel</h2>
        <button onclick="scrollToSection('dashboardSection')">Dashboard</button>
        <button onclick="scrollToSection('profileSection')">Profile</button>
        <button onclick="scrollToSection('passwordSection')">Password</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="main-content">
        <div class="header"><div><h1>Welcome Student 👋</h1><p>Manage your academic profile professionally</p></div><button class="dark-btn" onclick="toggleDarkMode()">Dark Mode</button></div>
        <div class="cards" id="dashboardSection">
            <div class="card"><h3>Student ID</h3><p id="studentId"></p></div>
            <div class="card"><h3>Course</h3><p id="courseCard"></p></div>
            <div class="card"><h3>Email Status</h3><p>Verified</p></div>
            <div class="card"><h3>Profile</h3><p>80%</p></div>
        </div>
        <div class="content-grid">
            <div class="box" id="profileSection">
                <h2>Profile Management</h2>
                <img id="profilePhoto" class="profile-photo" src="https://via.placeholder.com/150" alt="Profile">
                <input type="file" id="photoFile">
                <button class="btn upload-btn" onclick="uploadPhoto()">Upload Photo</button>
                <input type="text" id="name" placeholder="Enter Name">
                <input type="text" id="email" placeholder="Enter Email">
                <input type="text" id="course" placeholder="Course" readonly>
                <button class="btn update-btn" onclick="updateStudent()">Update Profile</button>
                <div class="progress-bar"><div class="progress">80% Complete</div></div>
            </div>
            <div class="box" id="passwordSection">
                <h2>Change Password</h2>
                <input type="password" id="oldPassword" placeholder="Enter Old Password"><button class="btn show-btn" onclick="togglePassword('oldPassword')">Show/Hide</button>
                <input type="password" id="newPassword" placeholder="Enter New Password"><button class="btn show-btn" onclick="togglePassword('newPassword')">Show/Hide</button>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password"><button class="btn show-btn" onclick="togglePassword('confirmPassword')">Show/Hide</button>
                <button class="btn password-btn" onclick="changePassword()">Change Password</button>
            </div>
        </div>
        <div class="table-box">
            <h2>Student Records</h2>
            <input type="text" id="searchBox" placeholder="Search by name..." onkeyup="searchStudent()">
            <table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th></tr></thead><tbody id="studentTable"></tbody></table>
        </div>
    </div>
</div>
<script>
    let currentStudentId=1;
    async function loadStudent(){const response=await fetch('/students/1');const student=await response.json();currentStudentId=student.id;document.getElementById('studentId').innerText=student.id;document.getElementById('courseCard').innerText=student.course;document.getElementById('name').value=student.name;document.getElementById('email').value=student.email;document.getElementById('course').value=student.course;if(student.photo){document.getElementById('profilePhoto').src=student.photo;}loadTable(student);}
    function loadTable(student){document.getElementById('studentTable').innerHTML=`<tr><td>${student.id}</td><td>${student.name}</td><td>${student.email}</td><td>${student.course}</td></tr>`;}
    async function uploadPhoto(){const file=document.getElementById('photoFile').files[0];if(!file){alert('Please select a photo');return;}const formData=new FormData();formData.append('file',file);const response=await fetch(`/students/upload/${currentStudentId}`,{method:'POST',body:formData});alert(await response.text());loadStudent();}
    async function updateStudent() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const course = document.getElementById('course').value;

        if (!/^[A-Z][a-zA-Z ]{2,}$/.test(name)) {
            alert('Name must start with capital letter');
            return;
        }

        if (!/^[a-z][a-z0-9._%+-]*@gmail\.com$/.test(email)) {
            alert('Email must start with small letter and end with @gmail.com');
            return;
        }

        await fetch(`/students/${currentStudentId}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name,
                email,
                course
            })
        });

        alert('Profile Updated Successfully');
        loadStudent();
    }
    async function changePassword(){const username=localStorage.getItem('username');const oldPassword=document.getElementById('oldPassword').value;const newPassword=document.getElementById('newPassword').value;const confirmPassword=document.getElementById('confirmPassword').value;if(oldPassword===''){alert('Old password required');return;}if(newPassword.length<6){alert('Password must be at least 6 characters');return;}if(!/[A-Za-z]/.test(newPassword)||!/[0-9]/.test(newPassword)){alert('Password must contain letters and numbers');return;}if(newPassword!==confirmPassword){alert('Passwords do not match');return;}const response=await fetch(`/change-password/${username}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:oldPassword,role:newPassword})});alert(await response.text());}
    function togglePassword(id){const field=document.getElementById(id);field.type=field.type==='password'?'text':'password';}
    function searchStudent(){const value=document.getElementById('searchBox').value.toLowerCase();document.querySelectorAll('#studentTable tr').forEach(row=>{row.style.display=row.innerText.toLowerCase().includes(value)?'':'none';});}
    function toggleDarkMode(){document.body.classList.toggle('dark-mode');}
    function scrollToSection(sectionId) {
        const section = document.getElementById(sectionId);

        if (!section) return;

        if (sectionId === "passwordSection") {
            document.getElementById("oldPassword").focus();
        }

        section.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        section.style.boxShadow = "0 0 25px #2563eb";
        section.style.transition = "0.4s";

        setTimeout(() => {
            section.style.boxShadow = "0 8px 20px rgba(0,0,0,0.08)";
        }, 1500);
    }
    function logout(){localStorage.clear();window.location.href='/login.html';}
    loadStudent();
</script>
</body>
</html>
