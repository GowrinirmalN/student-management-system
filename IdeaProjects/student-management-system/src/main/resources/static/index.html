<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f3f4f6;
            transition: 0.3s;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #111827, #1e3a8a);
            color: white;
            padding: 30px 20px;
            position: fixed;
            height: 100%;
            box-shadow: 4px 0 20px rgba(0,0,0,0.2);
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
        }

        .sidebar button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .sidebar button:hover {
            background: #2563eb;
            transform: translateX(5px);
        }

        .logout-btn {
            background: #dc2626 !important;
        }

        .main-content {
            margin-left: 280px;
            padding: 30px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            padding: 30px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .header h1 {
            font-size: 34px;
        }

        .dark-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: gray;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        .section-box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .section-box h2 {
            margin-bottom: 20px;
            color: #111827;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
        }

        .button-row {
            margin: 15px 0;
        }

        button.action-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }

        .save-btn,
        .refresh-btn,
        .search-btn,
        .edit-btn,
        .delete-btn,
        .logout-btn,
        .create-btn{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            color:white;
            border:none;
            padding:12px 22px;
            border-radius:12px;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
            transition:0.3s;
            box-shadow:0 4px 15px rgba(37,99,235,0.3);
        }

        .save-btn:hover,
        .refresh-btn:hover,
        .search-btn:hover,
        .edit-btn:hover,
        .delete-btn:hover,
        .logout-btn:hover,
        .create-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 8px 22px rgba(124,58,237,0.45);
            opacity:0.95;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .edit-btn {
            background: #16a34a;
            padding: 8px 14px;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 14px;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .dark-mode {
            background: #111827 !important;
            color: white !important;
        }

        .dark-mode .card,
        .dark-mode .section-box {
            background: #1f2937;
            color: white;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">

    <div class="sidebar">
        <h2>⚙ Admin Panel</h2>

        <button onclick="scrollToSection('dashboardSection')">Dashboard</button>
        <button onclick="scrollToSection('studentSection')">Students</button>
        <button onclick="scrollToSection('userSection')">Users</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-content">

        <div class="header">
            <div>
                <h1>Welcome Admin 👋</h1>
                <p>Manage students and system users professionally</p>
            </div>
            <button class="dark-btn" onclick="toggleDarkMode()">Dark Mode</button>
        </div>
        <div class="cards" id="dashboardSection">
            <div class="card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="card">
                <h3>Total Users</h3>
                <p id="totalUsers">0</p>
            </div>

            <div class="card">
                <h3>Admin Users</h3>
                <p id="adminCount">0</p>
            </div>

            <div class="card">
                <h3>Student Users</h3>
                <p id="studentCount">0</p>
            </div>
        </div>

        <div class="section-box" id="studentSection">
            <h2>Student Management</h2>

            <input type="hidden" id="studentId">

            <input type="text" id="name" placeholder="Enter Name">
            <input type="email" id="email" placeholder="Enter Email">
            <input type="text" id="course" placeholder="Enter Course">

            <div class="button-row">
                <button class="action-btn save-btn" onclick="saveStudent()">Save Student</button>
                <button class="action-btn refresh-btn" onclick="loadStudents()">Refresh</button>
            </div>

            <input type="text" id="searchName" placeholder="Search by Name">
            <button class="action-btn search-btn" onclick="searchByName()">Search Name</button>

            <input type="text" id="searchEmail" placeholder="Search by Email">
            <button class="action-btn search-btn" onclick="searchByEmail()">Search Email</button>

            <input type="text" id="searchCourse" placeholder="Search by Course">
            <button class="action-btn search-btn" onclick="searchByCourse()">Search Course</button>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>

        <div class="section-box" id="userSection">
            <h2>User Management</h2>

            <input type="text" id="newUsername" placeholder="Enter Username">
            <input type="password" id="newPassword" placeholder="Enter Password">

            <select id="newRole">
                <option value="ADMIN">ADMIN</option>
                <option value="STUDENT">STUDENT</option>
            </select>

            <button class="action-btn create-btn" onclick="createUser()">Create User</button>

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

    </div>
</div>

<script>
    let currentStudentId = null;
    function loadStudents() {
        fetch("/students")
            .then(response => response.json())
            .then(data => {
                document.getElementById("totalStudents").innerText = data.length;

                let rows = "";

                data.forEach(student => {
                    rows += `
                        <tr>
                            <td>${student.id}</td>
                            <td>${student.name}</td>
                            <td>${student.email}</td>
                            <td>${student.course}</td>
                            <td>
                                <button class="edit-btn" onclick="editStudent(${student.id}, '${student.name}', '${student.email}', '${student.course}')">Edit</button>
                                <button class="delete-btn" onclick="deleteStudent(${student.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("studentTableBody").innerHTML = rows;
            });
    }

    function saveStudent() {
        const student = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            course: document.getElementById("course").value
        };

        let url = "/students";
        let method = "POST";

        if (currentStudentId) {
            url = "/students/" + currentStudentId;
            method = "PUT";
        }

        fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(student)
        }).then(() => {
            loadStudents();
            clearForm();
        });
    }

    function editStudent(id, name, email, course) {
        currentStudentId = id;
        document.getElementById("name").value = name;
        document.getElementById("email").value = email;
        document.getElementById("course").value = course;
    }

    function deleteStudent(id) {
        if (!confirm("Delete this student?")) return;

        fetch("/students/" + id, {
            method: "DELETE"
        }).then(() => loadStudents());
    }

    function clearForm() {
        currentStudentId = null;
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("course").value = "";
    }

    function searchByName() {
        const name = document.getElementById("searchName").value;

        fetch("/students/search?name=" + name)
            .then(response => response.json())
            .then(data => showStudents(data));
    }

    function searchByEmail() {
        const email = document.getElementById("searchEmail").value;

        fetch("/students/search/email?email=" + email)
            .then(response => response.json())
            .then(data => showStudents(data));
    }

    function searchByCourse() {
        const course = document.getElementById("searchCourse").value;

        fetch("/students/search/course?course=" + course)
            .then(response => response.json())
            .then(data => showStudents(data));
    }

    function showStudents(data) {
        let rows = "";

        data.forEach(student => {
            rows += `
                <tr>
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.course}</td>
                    <td>
                        <button class="edit-btn" onclick="editStudent(${student.id}, '${student.name}', '${student.email}', '${student.course}')">Edit</button>
                        <button class="delete-btn" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("studentTableBody").innerHTML = rows;
    }

    function loadUsers() {
        fetch("/users")
            .then(response => response.json())
            .then(users => {
                document.getElementById("totalUsers").innerText = users.length;

                let adminCount = 0;
                let studentCount = 0;
                let rows = "";

                users.forEach(user => {
                    if (user.role === "ADMIN") adminCount++;
                    if (user.role === "STUDENT") studentCount++;

                    rows += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.role}</td>
                            <td>
                                <button class="delete-btn" onclick="deleteUser(${user.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("adminCount").innerText = adminCount;
                document.getElementById("studentCount").innerText = studentCount;
                document.getElementById("userTableBody").innerHTML = rows;
            });
    }

    function createUser() {
        const user = {
            username: document.getElementById("newUsername").value,
            password: document.getElementById("newPassword").value,
            role: document.getElementById("newRole").value
        };

        fetch("/users", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(user)
        }).then(() => {
            loadUsers();
        });
    }

    function deleteUser(id) {
        if (!confirm("Delete this user?")) return;

        fetch("/users/" + id, {
            method: "DELETE"
        }).then(() => loadUsers());
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark-mode");
    }

    function scrollToSection(sectionId) {
        document.getElementById(sectionId).scrollIntoView({
            behavior: "smooth"
        });
    }

    function logout() {
        window.location.href = "/login.html";
    }

    loadStudents();
    loadUsers();
</script>

</body>
</html>
